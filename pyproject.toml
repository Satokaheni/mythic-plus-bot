[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mythic-plus-bot"
version = "1.0.0"
description = "Discord bot for managing WoW Mythic+ raid scheduling and availability"
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.0.0",
    "python-dotenv>=1.0.0",
    # Bundled IANA timezone database — zoneinfo falls back to it when the OS tz data
    # lacks a key (e.g. the US/* aliases on minimal container images).
    "tzdata>=2024.1",
    # Sync HTTP for the standalone loot council CLI (the bot itself uses aiohttp).
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "freezegun>=1.0",
]

# bot.py is the entry point; everything else lives in the mythicbot package (plus the
# standalone lootcouncil CLI).
[tool.setuptools]
py-modules = ["bot"]

[tool.setuptools.packages.find]
include = ["mythicbot*", "lootcouncil*"]

[tool.setuptools.package-data]
"mythicbot.assistant" = ["system_prompt.md"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "mythicbot", "lootcouncil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
